<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 256" width="720" height="256" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipeline-title pipeline-desc" id="pipeline-root">
<title id="pipeline-title">StackSense scoring pipeline</title>
<desc id="pipeline-desc">Seven stages turn answers into an explained recommendation: normalise, derive peak load and scale tier, detect conflicts, then weight the criteria, filter and score, and search stacks, the three stages that decide the pick, and finally explain.</desc>
<defs>
      <style>#pipeline-root { font-family: Geist, 'Segoe UI', Helvetica, Arial, sans-serif; color: #241c2e; }</style><marker id="pipeline-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#5b5266"/></marker><marker id="pipeline-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#4b2a63"/></marker></defs>
<rect width="720" height="256" fill="#f6f1ea"/>
<rect x="16" y="110" width="556" height="134" rx="8" fill="#4b2a63" fill-opacity="0.04" stroke="#4b2a63" stroke-width="1"/>
<text x="564" y="125" font-family="'Geist Mono', Consolas, Menlo, monospace" font-size="11" fill="#4b2a63" text-anchor="end" letter-spacing="0.04em">STAGES 4 TO 6 DECIDE THE PICK</text>
<path d="M 236,54 H 252" fill="none" stroke="#5b5266" stroke-width="1.2" marker-end="url(#pipeline-arrow)"/>
<path d="M 468,54 H 484" fill="none" stroke="#5b5266" stroke-width="1.2" marker-end="url(#pipeline-arrow)"/>
<path d="M 594,92 V 94 Q 594,102 586,102 H 120 Q 112,102 112,110 V 130" fill="none" stroke="#5b5266" stroke-width="1.2" marker-end="url(#pipeline-arrow)"/>
<path d="M 200,183 H 216" fill="none" stroke="#5b5266" stroke-width="1.2" marker-end="url(#pipeline-arrow)"/>
<path d="M 376,183 H 392" fill="none" stroke="#5b5266" stroke-width="1.2" marker-end="url(#pipeline-arrow)"/>
<path d="M 564,183 H 588" fill="none" stroke="#5b5266" stroke-width="1.2" marker-end="url(#pipeline-arrow)"/>
<rect x="16" y="16" width="220" height="76" rx="6" fill="#f6f1ea"/><rect x="16" y="16" width="220" height="76" rx="6" fill="#ffffff" stroke="#241c2e" stroke-width="1"/>
<rect x="24" y="24" width="16" height="16" rx="2" fill="#ffffff" stroke="#241c2e" stroke-width="1"/>
<text x="32" y="36" font-family="'Geist Mono', Consolas, Menlo, monospace" font-size="11" fill="#241c2e" font-weight="600" text-anchor="middle">1</text>
<text x="46" y="37" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#241c2e" font-weight="600">Normalise</text>
<text x="24" y="54" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#241c2e">Missing answers take documented</text>
<text x="24" y="69" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#241c2e">defaults, listed as assumptions;</text>
<text x="24" y="84" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#241c2e">bad values clamped, with a warning.</text>
<rect x="252" y="16" width="216" height="76" rx="6" fill="#f6f1ea"/><rect x="252" y="16" width="216" height="76" rx="6" fill="#ffffff" stroke="#241c2e" stroke-width="1"/>
<rect x="260" y="24" width="16" height="16" rx="2" fill="#ffffff" stroke="#241c2e" stroke-width="1"/>
<text x="268" y="36" font-family="'Geist Mono', Consolas, Menlo, monospace" font-size="11" fill="#241c2e" font-weight="600" text-anchor="middle">2</text>
<text x="282" y="37" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#241c2e" font-weight="600">Derive</text>
<text x="260" y="54" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#241c2e">peak req/s = users × requests per</text>
<text x="260" y="69" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#241c2e">user / 86,400 × peak factor;</text>
<text x="260" y="84" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#241c2e">then the scale tier, 0 to 5.</text>
<rect x="484" y="16" width="220" height="76" rx="6" fill="#f6f1ea"/><rect x="484" y="16" width="220" height="76" rx="6" fill="#ffffff" stroke="#241c2e" stroke-width="1"/>
<rect x="492" y="24" width="16" height="16" rx="2" fill="#ffffff" stroke="#241c2e" stroke-width="1"/>
<text x="500" y="36" font-family="'Geist Mono', Consolas, Menlo, monospace" font-size="11" fill="#241c2e" font-weight="600" text-anchor="middle">3</text>
<text x="514" y="37" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#241c2e" font-weight="600">Detect conflicts</text>
<text x="492" y="54" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#241c2e">22 contradiction checks; fixed order:</text>
<text x="492" y="69" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#241c2e">compliance > deployment > physics</text>
<text x="492" y="84" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#241c2e">and team > budget and preferences.</text>
<rect x="24" y="130" width="176" height="106" rx="6" fill="#f6f1ea"/><rect x="24" y="130" width="176" height="106" rx="6" fill="#ffffff" stroke="#241c2e" stroke-width="1"/>
<rect x="32" y="138" width="16" height="16" rx="2" fill="#b8872b" stroke="#b8872b" stroke-width="1"/>
<text x="40" y="150" font-family="'Geist Mono', Consolas, Menlo, monospace" font-size="11" fill="#241c2e" font-weight="600" text-anchor="middle">4</text>
<text x="54" y="151" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#241c2e" font-weight="600">Weight the criteria</text>
<text x="32" y="172" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#241c2e">weight(c) = baseline(c)</text>
<text x="32" y="186" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#241c2e">+ Σ contributions, each kept</text>
<text x="32" y="200" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#241c2e">with the answer that caused it;</text>
<text x="32" y="214" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#241c2e">19 criteria.</text>
<rect x="216" y="130" width="160" height="106" rx="6" fill="#f6f1ea"/><rect x="216" y="130" width="160" height="106" rx="6" fill="#ffffff" stroke="#241c2e" stroke-width="1"/>
<rect x="224" y="138" width="16" height="16" rx="2" fill="#b8872b" stroke="#b8872b" stroke-width="1"/>
<text x="232" y="150" font-family="'Geist Mono', Consolas, Menlo, monospace" font-size="11" fill="#241c2e" font-weight="600" text-anchor="middle">5</text>
<text x="246" y="151" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#241c2e" font-weight="600">Filter, then score</text>
<text x="224" y="172" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#241c2e">Hard constraints remove</text>
<text x="224" y="186" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#241c2e">options first; then</text>
<text x="224" y="200" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#241c2e">score = Σ(w × s) / Σ w,</text>
<text x="224" y="214" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#241c2e">from 0 to 100.</text>
<rect x="392" y="130" width="172" height="106" rx="6" fill="#f6f1ea"/><rect x="392" y="130" width="172" height="106" rx="6" fill="#ffffff" stroke="#241c2e" stroke-width="1"/>
<rect x="400" y="138" width="16" height="16" rx="2" fill="#b8872b" stroke="#b8872b" stroke-width="1"/>
<text x="408" y="150" font-family="'Geist Mono', Consolas, Menlo, monospace" font-size="11" fill="#241c2e" font-weight="600" text-anchor="middle">6</text>
<text x="422" y="151" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#241c2e" font-weight="600">Search stacks</text>
<text x="400" y="172" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#241c2e">Top 5 per layer: 625 stacks;</text>
<text x="400" y="186" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#241c2e">stack score = (Σ 4 layer</text>
<text x="400" y="200" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#241c2e">scores + Σ rule adjustments)</text>
<text x="400" y="214" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#241c2e">/ 4; ties within 1 point use</text>
<text x="400" y="228" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#241c2e">fixed preferences.</text>
<rect x="588" y="130" width="116" height="106" rx="6" fill="#f6f1ea"/><rect x="588" y="130" width="116" height="106" rx="6" fill="#ffffff" stroke="#241c2e" stroke-width="1"/>
<rect x="596" y="138" width="16" height="16" rx="2" fill="#ffffff" stroke="#241c2e" stroke-width="1"/>
<text x="604" y="150" font-family="'Geist Mono', Consolas, Menlo, monospace" font-size="11" fill="#241c2e" font-weight="600" text-anchor="middle">7</text>
<text x="618" y="151" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#241c2e" font-weight="600">Explain</text>
<text x="596" y="172" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#241c2e">Contributions per</text>
<text x="596" y="186" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#241c2e">answer, runner-up</text>
<text x="596" y="200" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#241c2e">margin, trade-offs,</text>
<text x="596" y="214" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#241c2e">cost band.</text>
</svg>
