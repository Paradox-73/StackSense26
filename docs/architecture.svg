<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 392" width="720" height="392" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
<title id="architecture-title">StackSense architecture</title>
<desc id="architecture-desc">Scenario files from the command line or the Scenario file page pass through the scenario adapter into the pure-Python rule engine, which reads the cited data files and returns the standard output; questionnaire answers enter the engine directly, and the optional language model sits behind an off switch, outside the decision path.</desc>
<defs>
      <style>#architecture-root { font-family: Geist, 'Segoe UI', Helvetica, Arial, sans-serif; color: #241c2e; }</style><marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#5b5266"/></marker><marker id="architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#4b2a63"/></marker></defs>
<rect width="720" height="392" fill="#f6f1ea"/>
<rect x="16" y="84" width="176" height="180" rx="8" fill="#241c2e" fill-opacity="0.02" stroke="#d9d0e0" stroke-width="1"/>
<text x="24" y="100" font-size="11" fill="#5b5266" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif"><tspan font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600">FastAPI app </tspan><tspan font-family="'Geist Mono', Consolas, Menlo, monospace">app/main.py</tspan></text>
<path d="M 192,46 H 216" fill="none" stroke="#4b2a63" stroke-width="1.6" marker-end="url(#architecture-arrow-accent)"/>
<path d="M 184,134 H 216" fill="none" stroke="#4b2a63" stroke-width="1.6" marker-end="url(#architecture-arrow-accent)"/>
<path d="M 368,120 H 392" fill="none" stroke="#4b2a63" stroke-width="1.6" marker-end="url(#architecture-arrow-accent)"/>
<path d="M 552,70 H 576" fill="none" stroke="#4b2a63" stroke-width="1.6" marker-end="url(#architecture-arrow-accent)"/>
<path d="M 184,240 H 392" fill="none" stroke="#241c2e" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
<path d="M 576,200 H 552" fill="none" stroke="#5b5266" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
<path d="M 104,256 V 280" fill="none" stroke="#5b5266" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#architecture-arrow)" marker-start="url(#architecture-arrow)"/>
<path d="M 192,328 H 216" fill="none" stroke="#5b5266" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#architecture-arrow)" marker-start="url(#architecture-arrow)"/>
<rect x="268.0" y="250" width="56" height="15" rx="2" fill="#f6f1ea"/><text x="296" y="261" font-family="'Geist Mono', Consolas, Menlo, monospace" font-size="11" fill="#241c2e" text-anchor="middle" letter-spacing="0.04em">ANSWERS</text>
<rect x="16" y="16" width="176" height="60" rx="6" fill="#f6f1ea"/><rect x="16" y="16" width="176" height="60" rx="6" fill="#ffffff" stroke="#241c2e" stroke-width="1"/>
<text x="24" y="36" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#241c2e" font-weight="600">Command line</text>
<text x="24" y="53" font-family="'Geist Mono', Consolas, Menlo, monospace" font-size="11" fill="#5b5266">cli.py --scenario FILE</text>
<text x="24" y="68" font-family="'Geist Mono', Consolas, Menlo, monospace" font-size="11" fill="#5b5266">--out DIR</text>
<rect x="24" y="104" width="160" height="60" rx="6" fill="#f6f1ea"/><rect x="24" y="104" width="160" height="60" rx="6" fill="#ffffff" stroke="#241c2e" stroke-width="1"/>
<text x="32" y="124" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#241c2e" font-weight="600">Scenario file page</text>
<text x="32" y="141" font-family="'Geist Mono', Consolas, Menlo, monospace" font-size="11" fill="#5b5266">/scenario</text>
<text x="32" y="156" font-family="'Geist Mono', Consolas, Menlo, monospace" font-size="11" fill="#5b5266">POST /api/scenario</text>
<rect x="24" y="176" width="160" height="80" rx="6" fill="#f6f1ea"/><rect x="24" y="176" width="160" height="80" rx="6" fill="#ffffff" stroke="#241c2e" stroke-width="1"/>
<text x="32" y="196" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#241c2e" font-weight="600">Questionnaire<tspan font-family="'Geist Mono', Consolas, Menlo, monospace" font-size="11" fill="#5b5266" font-weight="400"> /</tspan></text>
<text x="32" y="213" font-family="'Geist Mono', Consolas, Menlo, monospace" font-size="11" fill="#5b5266">POST /api/recommend</text>
<text x="32" y="230" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#241c2e">Quick mode: 7 questions</text>
<text x="32" y="246" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#241c2e">Refine: 42 questions</text>
<rect x="216" y="16" width="152" height="206" rx="6" fill="#f6f1ea"/><rect x="216" y="16" width="152" height="206" rx="6" fill="#ffffff" stroke="#241c2e" stroke-width="1"/>
<text x="224" y="36" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#241c2e" font-weight="600">Scenario adapter</text>
<text x="224" y="53" font-family="'Geist Mono', Consolas, Menlo, monospace" font-size="11" fill="#5b5266">engine/standard.py</text>
<text x="224" y="74" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#241c2e">Checks every field;</text>
<text x="224" y="90" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#241c2e">an error gives status</text>
<text x="224" y="106" font-size="12" fill="#241c2e" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif"><tspan font-family="'Geist Mono', Consolas, Menlo, monospace">invalid_input</tspan><tspan font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif">,</tspan></text>
<text x="224" y="122" font-size="12" fill="#241c2e" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif"><tspan font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif">stack </tspan><tspan font-family="'Geist Mono', Consolas, Menlo, monospace">null</tspan><tspan font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif">.</tspan></text>
<text x="224" y="142" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#241c2e">Maps fields to answers;</text>
<text x="224" y="158" font-size="11" fill="#241c2e" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif"><tspan font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif">defaults in </tspan><tspan font-family="'Geist Mono', Consolas, Menlo, monospace">assumptions</tspan></text>
<text x="224" y="178" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#241c2e">Runs the engine and</text>
<text x="224" y="194" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#241c2e">builds the output.</text>
<text x="224" y="214" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#241c2e" font-weight="600">No language model.</text>
<rect x="392" y="16" width="160" height="240" rx="6" fill="#f6f1ea"/><rect x="392" y="16" width="160" height="240" rx="6" fill="#4b2a63" fill-opacity="0.05" stroke="#4b2a63" stroke-width="1.6"/>
<text x="400" y="36" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#241c2e" font-weight="600">Rule engine</text>
<text x="400" y="53" font-size="11" fill="#5b5266" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif"><tspan font-family="'Geist Mono', Consolas, Menlo, monospace">engine/</tspan><tspan font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif">  pure Python</tspan></text>
<text x="400" y="74" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#241c2e">profile: derive numbers</text>
<text x="400" y="90" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#241c2e">conflicts: 22 checks</text>
<text x="400" y="106" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#241c2e">scoring, hard filters</text>
<text x="400" y="122" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#241c2e">search: 625 stacks,</text>
<text x="400" y="138" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#241c2e">62 compatibility rules</text>
<text x="400" y="154" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#241c2e">explain, cost band</text>
<text x="400" y="196" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#241c2e" font-weight="600">Same input,</text>
<text x="400" y="212" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#241c2e" font-weight="600">same stack.</text>
<rect x="576" y="16" width="128" height="108" rx="6" fill="#f6f1ea"/><rect x="576" y="16" width="128" height="108" rx="6" fill="#ffffff" stroke="#241c2e" stroke-width="1"/>
<text x="584" y="36" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#241c2e" font-weight="600">Standard output</text>
<text x="584" y="53" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#241c2e">status, stack, cost,</text>
<text x="584" y="68" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#241c2e">warnings, assumptions</text>
<text x="584" y="85" font-family="'Geist Mono', Consolas, Menlo, monospace" font-size="11" fill="#5b5266">outputs/</text>
<text x="584" y="100" font-family="'Geist Mono', Consolas, Menlo, monospace" font-size="11" fill="#5b5266">&lt;scenario_id&gt;</text>
<text x="584" y="115" font-family="'Geist Mono', Consolas, Menlo, monospace" font-size="11" fill="#5b5266">_output.json</text>
<rect x="576" y="140" width="128" height="124" rx="6" fill="#f6f1ea"/><rect x="576" y="140" width="128" height="124" rx="6" fill="#ffffff" stroke="#b8872b" stroke-width="1.4"/>
<text x="584" y="160" font-family="'Geist Mono', Consolas, Menlo, monospace" font-size="14" fill="#241c2e" font-weight="600">data/</text>
<text x="584" y="176" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5b5266">All knowledge, cited:</text>
<text x="584" y="192" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#241c2e">60 technologies</text>
<text x="584" y="207" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#241c2e">62 rules, glossary</text>
<text x="584" y="222" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#241c2e">42 questions, defaults</text>
<text x="584" y="237" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#241c2e">14 examples</text>
<text x="584" y="252" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#241c2e">score rubric</text>
<rect x="16" y="280" width="176" height="96" rx="6" fill="#f6f1ea"/><rect x="16" y="280" width="176" height="96" rx="6" fill="#ffffff" stroke="#241c2e" stroke-width="1.4"/>
<text x="24" y="300" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#241c2e" font-weight="600">LLM-off switch</text>
<text x="24" y="317" font-size="11" fill="#241c2e" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif"><tspan font-family="'Geist Mono', Consolas, Menlo, monospace">STACKSENSE_LLM=off</tspan><tspan font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif"> or</tspan></text>
<text x="24" y="332" font-size="11" fill="#241c2e" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif"><tspan font-family="'Geist Mono', Consolas, Menlo, monospace">--no-llm</tspan><tspan font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif"> on </tspan><tspan font-family="'Geist Mono', Consolas, Menlo, monospace">run.py</tspan><tspan font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif"> and</tspan></text>
<text x="24" y="347" font-size="11" fill="#241c2e" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif"><tspan font-family="'Geist Mono', Consolas, Menlo, monospace">cli.py</tspan><tspan font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif">: no model request.</tspan></text>
<text x="24" y="362" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#241c2e" font-weight="600">The stack is the same.</text>
<rect x="216" y="280" width="488" height="96" rx="6" fill="#f6f1ea"/><rect x="216" y="280" width="488" height="96" rx="6" fill="#f6f1ea" stroke="#5b5266" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="228" y="300" font-size="12" fill="#241c2e" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif"><tspan font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600">Language model, optional  </tspan><tspan font-family="'Geist Mono', Consolas, Menlo, monospace">engine/llm.py, brief.py, summary.py</tspan></text>
<text x="228" y="318" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#241c2e">Brief: an answer suggested from the text is</text>
<text x="228" y="333" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#241c2e">kept only if it is a valid value and quotes</text>
<text x="228" y="348" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#241c2e">words from the text; the user confirms it.</text>
<text x="468" y="318" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#241c2e">Summary: a reworded summary may use only</text>
<text x="468" y="333" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#241c2e">the technologies and numbers in the engine's</text>
<text x="468" y="348" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#241c2e">facts, else the template text is shown.</text>
<text x="228" y="366" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#241c2e" font-weight="600">Never picks a technology. A scenario file never reaches it.</text>
</svg>
