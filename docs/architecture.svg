<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 730" width="830" height="730" role="img" aria-labelledby="t d">
<title id="t">StackSense architecture</title><desc id="d">The browser sends answers to a FastAPI app, which calls the pure-Python engine; the engine reads the knowledge base and questionnaire files in data/.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4b2a63"/></marker></defs>
<rect width="830" height="730" fill="#f6f1ea"/>
<text x="20" y="30" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#241c2e">StackSense architecture</text>
<rect x="20" y="200" width="215" height="330" rx="8" fill="#fff" stroke="#4b2a63" stroke-width="1.6"/>
<text x="32" y="222" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#241c2e">Browser</text>
<text x="32" y="244" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#241c2e">app/static (no build step)</text>
<text x="32" y="262" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#241c2e">Describe-your-project box</text>
<text x="32" y="280" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#241c2e">Quick mode: 7 questions</text>
<text x="32" y="298" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#241c2e">Refine: 36 questions</text>
<text x="32" y="316" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#241c2e">Not sure on every one</text>
<text x="32" y="334" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#241c2e">Glossary popovers</text>
<text x="32" y="352" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#241c2e"></text>
<text x="32" y="370" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#241c2e">Result: 4 picks, cost,</text>
<text x="32" y="388" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#241c2e">Why, Growth path,</text>
<text x="32" y="406" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#241c2e">Architecture, Alternatives,</text>
<text x="32" y="424" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#241c2e">Why not X, How stable</text>
<rect x="285" y="200" width="225" height="330" rx="8" fill="#fff" stroke="#4b2a63" stroke-width="1.6"/>
<text x="297" y="222" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#241c2e">FastAPI  (app/main.py)</text>
<text x="297" y="244" font-family="Consolas, Menlo, monospace" font-size="13" fill="#241c2e">POST /api/recommend</text>
<text x="297" y="262" font-family="Consolas, Menlo, monospace" font-size="13" fill="#241c2e">POST /api/sensitivity</text>
<text x="297" y="280" font-family="Consolas, Menlo, monospace" font-size="13" fill="#241c2e">POST /api/next</text>
<text x="297" y="298" font-family="Consolas, Menlo, monospace" font-size="13" fill="#241c2e">POST /api/switch</text>
<text x="297" y="316" font-family="Consolas, Menlo, monospace" font-size="13" fill="#241c2e">POST /api/whynot</text>
<text x="297" y="334" font-family="Consolas, Menlo, monospace" font-size="13" fill="#241c2e">POST /api/robustness</text>
<text x="297" y="352" font-family="Consolas, Menlo, monospace" font-size="13" fill="#241c2e">POST /api/export/markdown</text>
<text x="297" y="370" font-family="Consolas, Menlo, monospace" font-size="13" fill="#241c2e">POST /api/export/adr</text>
<text x="297" y="388" font-family="Consolas, Menlo, monospace" font-size="13" fill="#241c2e">GET  /api/questions</text>
<text x="297" y="406" font-family="Consolas, Menlo, monospace" font-size="13" fill="#241c2e">GET  /api/presets  /api/kb</text>
<text x="297" y="424" font-family="Consolas, Menlo, monospace" font-size="13" fill="#241c2e">GET  /api/glossary</text>
<rect x="560" y="200" width="250" height="330" rx="8" fill="#fff" stroke="#4b2a63" stroke-width="1.6"/>
<text x="572" y="222" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#241c2e">engine/  (pure Python)</text>
<text x="572" y="244" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#241c2e">profile      normalise, derive</text>
<text x="572" y="262" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#241c2e">conflicts    contradictions</text>
<text x="572" y="280" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#241c2e">scoring      weights, filters</text>
<text x="572" y="298" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#241c2e">stack        625 stacks, rules</text>
<text x="572" y="316" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#241c2e">explain      why, trade-offs</text>
<text x="572" y="334" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#241c2e">advice       cost, services</text>
<text x="572" y="352" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#241c2e">recommender  orchestration</text>
<text x="572" y="370" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#241c2e">sensitivity  Not sure</text>
<text x="572" y="388" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#241c2e">whynot       Why not X?</text>
<text x="572" y="406" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#241c2e">robustness   score noise</text>
<text x="572" y="424" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#241c2e">export       Markdown, ADR</text>
<line x1="235" y1="300" x2="285" y2="300" stroke="#4b2a63" stroke-width="2" marker-end="url(#a)"/><text x="260" y="290" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#4b2a63" text-anchor="middle">answers</text>
<line x1="285" y1="380" x2="235" y2="380" stroke="#4b2a63" stroke-width="2" marker-end="url(#a)"/><text x="260" y="397" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#4b2a63" text-anchor="middle">result</text>
<line x1="510" y1="300" x2="560" y2="300" stroke="#4b2a63" stroke-width="2" marker-end="url(#a)"/><text x="535" y="290" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#4b2a63" text-anchor="middle">call</text>
<line x1="560" y1="380" x2="510" y2="380" stroke="#4b2a63" stroke-width="2" marker-end="url(#a)"/><text x="535" y="397" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#4b2a63" text-anchor="middle">result</text>
<rect x="20" y="570" width="790" height="120" rx="8" fill="#fff" stroke="#b8872b" stroke-width="1.6"/>
<text x="32" y="592" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#241c2e">data/   (the only place knowledge lives; each item cites its sources)</text>
<rect x="32" y="612" width="120" height="62" rx="6" fill="#f6f1ea" stroke="#c9bfd1"/>
<text x="40" y="632" font-family="Consolas, Menlo, monospace" font-size="11.5" font-weight="600" fill="#241c2e">kb/*.json</text>
<text x="40" y="652" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#241c2e">56 technologies</text>
<rect x="160" y="612" width="120" height="62" rx="6" fill="#f6f1ea" stroke="#c9bfd1"/>
<text x="168" y="632" font-family="Consolas, Menlo, monospace" font-size="11.5" font-weight="600" fill="#241c2e">kb/compat_rules</text>
<text x="168" y="652" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#241c2e">62 rules</text>
<rect x="288" y="612" width="120" height="62" rx="6" fill="#f6f1ea" stroke="#c9bfd1"/>
<text x="296" y="632" font-family="Consolas, Menlo, monospace" font-size="11.5" font-weight="600" fill="#241c2e">questions.json</text>
<text x="296" y="652" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#241c2e">36 questions, defaults</text>
<rect x="416" y="612" width="120" height="62" rx="6" fill="#f6f1ea" stroke="#c9bfd1"/>
<text x="424" y="632" font-family="Consolas, Menlo, monospace" font-size="11.5" font-weight="600" fill="#241c2e">glossary.json</text>
<text x="424" y="652" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#241c2e">terms + sources</text>
<rect x="544" y="612" width="120" height="62" rx="6" fill="#f6f1ea" stroke="#c9bfd1"/>
<text x="552" y="632" font-family="Consolas, Menlo, monospace" font-size="11.5" font-weight="600" fill="#241c2e">presets.json</text>
<text x="552" y="652" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#241c2e">14 examples</text>
<rect x="672" y="612" width="120" height="62" rx="6" fill="#f6f1ea" stroke="#c9bfd1"/>
<text x="680" y="632" font-family="Consolas, Menlo, monospace" font-size="11.5" font-weight="600" fill="#241c2e">rubric.json</text>
<text x="680" y="652" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#241c2e">1/3/5 anchors</text>
<line x1="685" y1="530" x2="685" y2="570" stroke="#4b2a63" stroke-width="2" marker-end="url(#a)"/><text x="710" y="554" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#4b2a63" text-anchor="middle">reads</text>
<line x1="120" y1="570" x2="120" y2="530" stroke="#4b2a63" stroke-width="2" marker-end="url(#a)"/><text x="190" y="554" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#4b2a63" text-anchor="middle">renders the form</text>
<text x="20" y="702" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#241c2e">The rules decide every pick, cost and exclusion. The model only reads free text and words summaries; code checks both.</text>
<text x="20" y="720" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#241c2e">With no API key the app uses the pattern reader and template text and makes no network call: the same answers give the same stack.</text>
<rect x="20" y="50" width="215" height="100" rx="8" fill="#fff" stroke="#b8872b" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="32" y="72" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#241c2e">Brief reader</text>
<text x="32" y="92" font-family="Consolas, Menlo, monospace" font-size="12" fill="#241c2e">engine/brief.py</text>
<text x="32" y="110" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#241c2e">Pattern reader runs first.</text>
<text x="32" y="126" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#241c2e">Model value kept only if it</text>
<text x="32" y="142" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#241c2e">passes the schema + quote check</text>
<rect x="285" y="50" width="225" height="100" rx="8" fill="#fff" stroke="#b8872b" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="297" y="72" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#241c2e">Language model (optional)</text>
<text x="297" y="92" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#241c2e">OpenAI-compatible API,</text>
<text x="297" y="108" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#241c2e">default Gemini free tier, cached.</text>
<text x="297" y="126" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#241c2e">Reads text, words summaries.</text>
<text x="297" y="142" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#241c2e">Never picks a technology.</text>
<rect x="560" y="50" width="250" height="100" rx="8" fill="#fff" stroke="#b8872b" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="572" y="72" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#241c2e">Summary checker</text>
<text x="572" y="92" font-family="Consolas, Menlo, monospace" font-size="12" fill="#241c2e">engine/summary.py</text>
<text x="572" y="110" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#241c2e">Every technology and number</text>
<text x="572" y="126" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#241c2e">must be in the engine's facts;</text>
<text x="572" y="142" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#241c2e">else the template text is used</text>
<line x1="235" y1="100" x2="285" y2="100" stroke="#4b2a63" stroke-width="2" marker-end="url(#a)"/><text x="260" y="90" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#4b2a63" text-anchor="middle">text</text>
<line x1="510" y1="100" x2="560" y2="100" stroke="#4b2a63" stroke-width="2" marker-end="url(#a)"/><text x="535" y="90" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#4b2a63" text-anchor="middle">text</text>
<line x1="70" y1="200" x2="70" y2="150" stroke="#4b2a63" stroke-width="2" marker-end="url(#a)"/>
<text x="78" y="190" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#4b2a63" text-anchor="start">description</text>
<line x1="190" y1="150" x2="190" y2="200" stroke="#4b2a63" stroke-width="2" marker-end="url(#a)"/>
<text x="198" y="172" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#4b2a63" text-anchor="start">answers</text>
<line x1="640" y1="200" x2="640" y2="150" stroke="#4b2a63" stroke-width="2" marker-end="url(#a)"/>
<text x="632" y="180" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#4b2a63" text-anchor="end">facts</text>
<line x1="740" y1="150" x2="740" y2="200" stroke="#4b2a63" stroke-width="2" marker-end="url(#a)"/>
<text x="748" y="180" font-family="Geist, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#4b2a63" text-anchor="start">summary</text>
<text x="297" y="442" font-family="Consolas, Menlo, monospace" font-size="13" fill="#241c2e">POST /api/brief</text>
<text x="297" y="460" font-family="Consolas, Menlo, monospace" font-size="13" fill="#241c2e">POST /api/summary</text>
<text x="297" y="478" font-family="Consolas, Menlo, monospace" font-size="13" fill="#241c2e">POST /api/whatif</text>
</svg>