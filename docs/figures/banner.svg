<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="banner-title banner-desc">
<title id="banner-title">StackSense: tech-stack picks that explain themselves</title>
<desc id="banner-desc">Synergy '26 StackSense Challenge entry by Kanav Bhardwaj, IIIT Bangalore. A tech-stack recommendation engine: deterministic rules over a cited knowledge base choose the frontend, backend, database and hosting. 70 technologies, 65 compatibility rules, 42 questions, 1,290 tests; 82% top-1 and 96% acceptable on a 40-brief benchmark; 0 violations across 1,000 random projects.</desc>
<defs>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/></pattern>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#34d399" stop-opacity="0.16"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
<linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34d399"/><stop offset="0.4" stop-color="#2dd4bf"/><stop offset="0.7" stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
<clipPath id="frame"><rect width="1280" height="320" rx="16"/></clipPath>
</defs>
<g clip-path="url(#frame)">
<rect width="1280" height="320" fill="#0a1211"/>
<rect width="1280" height="320" fill="url(#dots)"/>
<ellipse cx="1030" cy="160" rx="300" ry="190" fill="url(#glow)"/>
<rect y="314" width="1280" height="6" fill="url(#rule)"/>
<rect x="0.5" y="0.5" width="1279" height="319" rx="16" fill="none" stroke="#1f2a37"/>
</g>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="64" y="62" fill="#34d399" font-size="14" font-weight="600" letter-spacing="2.2" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace">SYNERGY '26 STACKSENSE · IIIT BANGALORE</text>
<text x="62" y="126" fill="#f0f4f8" font-size="56" font-weight="700">StackSense</text>
<text x="62" y="178" fill="#f0f4f8" font-size="40" font-weight="700">Stack picks that <tspan fill="#34d399">explain themselves</tspan></text>
<text x="64" y="216" fill="#9aa7b4" font-size="18">70 technologies · 65 compatibility rules · same input, same stack</text>
<text x="64" y="244" fill="#34d399" font-size="18" font-weight="600">1,290 tests  ·  82% top-1, 96% acceptable  ·  0 violations in 1,000 runs</text>
<text x="64" y="284" fill="#6f7d8c" font-size="13" font-weight="600" letter-spacing="2" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace">BY</text>
<text x="100" y="285" fill="#f0f4f8" font-size="18" font-weight="600">Kanav Bhardwaj</text>

</g>
<g transform="translate(1030,160)"><g transform="translate(0,-96)"><path d="M-120 14 L0 -22 L120 14 L0 50 Z" fill="#34d399" fill-opacity="0.16" stroke="#34d399" stroke-width="1.6"/><text x="0" y="16" fill="#34d399" font-size="13" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace">frontend</text></g><g transform="translate(0,-44)"><path d="M-120 14 L0 -22 L120 14 L0 50 Z" fill="#2dd4bf" fill-opacity="0.16" stroke="#2dd4bf" stroke-width="1.6"/><text x="0" y="16" fill="#2dd4bf" font-size="13" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace">backend</text></g><g transform="translate(0,8)"><path d="M-120 14 L0 -22 L120 14 L0 50 Z" fill="#38bdf8" fill-opacity="0.16" stroke="#38bdf8" stroke-width="1.6"/><text x="0" y="16" fill="#38bdf8" font-size="13" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace">database</text></g><g transform="translate(0,60)"><path d="M-120 14 L0 -22 L120 14 L0 50 Z" fill="#818cf8" fill-opacity="0.16" stroke="#818cf8" stroke-width="1.6"/><text x="0" y="16" fill="#818cf8" font-size="13" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace">hosting</text></g></g>
</svg>
